*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.045em}
.wrap{max-width:760px;margin:0 auto;padding:24px 22px 36px;min-height:100dvh}

footer{border-top:1px solid var(--border);margin-top:38px;padding-top:18px;color:#aab0b1;font-size:12px;text-align:center}
@media(max-height:670px) and (max-width:699px){h1{margin:22px 0 15px}.lead{margin-bottom:24px}.minute{margin-bottom:10px}.steps{margin-bottom:17px}footer{margin-top:30px}}
